name: Release

# Tag-triggered release builds; ci.yml stays the PR/push gate.
on:
  push:
    tags: ['v*']

# softprops/action-gh-release creates the release object; without an
# explicit grant the default GITHUB_TOKEN is read-only (v1.5.1's first
# run failed with 403 "Resource not accessible by integration" on all
# legs whose builds succeeded).
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, archive: zip }
          # Linux. "rva23" from the spec maps to the riscv64gc triple:
          # rva23 is a RISC-V application-processor profile (RV64GC +
          # v1.0 vector extensions), which is exactly what the
          # riscv64gc-unknown-linux-* targets model.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, archive: tar }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, archive: tar }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, archive: tar }
          # rva23 → riscv64gc (see comment above).
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-musl, archive: tar }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu, archive: tar }
          # macOS (Apple silicon only, per spec)
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # gnu cross targets need the GNU cross toolchain. musl targets all
      # build via cargo-zigbuild + zig (first release run: cc-rs's ring
      # build could not find x86_64/aarch64-linux-musl-gcc, and
      # musl-tools has no riscv64 sysroot — zig supplies libc for all
      # three, so no apt musl packages at all).
      - name: Install cross toolchains (Linux non-native gnu targets)
        if: runner.os == 'Linux' && contains(matrix.target, 'gnu') && !contains(matrix.target, 'x86_64')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu

      # zig (the compiler, not just the cargo wrapper) is required by
      # cargo zigbuild; taiki-e/install-action installs cargo-zigbuild
      # only, and the first release run died with "Failed to find zig".
      # install-action also cannot install zig itself ("does not support
      # zig"; second run), so the compiler comes from setup-zig.
      - name: Install zig (all Linux musl targets)
        if: runner.os == 'Linux' && contains(matrix.target, 'musl')
        uses: mlugg/setup-zig@v1
      - name: Install cargo-zigbuild (all Linux musl targets)
        if: runner.os == 'Linux' && contains(matrix.target, 'musl')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (musl via cargo-zigbuild)
        if: runner.os == 'Linux' && contains(matrix.target, 'musl')
        shell: bash
        run: cargo zigbuild --release --target ${{ matrix.target }} -p buran -p buran-tui

      - name: Build
        if: runner.os != 'Linux' || !contains(matrix.target, 'musl')
        shell: bash
        env:
          # gnu cross targets: point rust at the GNU cross linker.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} -p buran -p buran-tui

      - name: Package
        shell: bash
        run: |
          dir="buran-${{ matrix.target }}"
          mkdir -p "$dir"
          for bin in buran buran-tui; do
            cp "target/${{ matrix.target }}/release/$bin" "$dir/" 2>/dev/null \
              || cp "target/${{ matrix.target }}/release/$bin.exe" "$dir/"
          done
          if [[ "${{ matrix.archive }}" == zip ]]; then
            out="buran-${{ matrix.target }}.zip"
            # Windows runners ship 7z but not zip (first release run:
            # "zip: command not found", exit 127).
            7z a "$out" "$dir"
          else
            out="buran-${{ matrix.target }}.tar.gz"
            tar czf "$out" "$dir"
          fi
          echo "ARCHIVE=$out" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
