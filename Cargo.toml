[workspace]
resolver = "3"
members = ["crates/buran", "crates/buran-tui"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/GamePad64/buran"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
jiff = { version = "1.0.2", features = ["serde"] }
itertools = "0.15.0"
futures = "0.3"
toml_edit = "0.23"
dirs = "6"
tokio-util = { version = "0.7", features = ["io"] }
tracing-appender = "0.2"
assert_cmd = "2"
predicates = "3"
agent-client-protocol-http = { version = "5", default-features = false, features = ["server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

# Binary-size budget (ADR 0008): fat LTO + one codegen unit + strip keeps
# buran at ~9 MB stripped (11.1 MB unstripped, 8.8 MB pre-LTO); budgets
# are ≤ 15 MB binary / ≤ 10 MB session RSS / ≤ 100 ms cold start.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true

