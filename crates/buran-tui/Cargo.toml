[package]
name = "buran-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TUI client for buran over ACP stdio"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
agent-client-protocol = { version = "5", features = ["stdio", "process"] }
# TestBackend (render tests) ships unconditionally in 0.30 via ratatui-core.
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"
