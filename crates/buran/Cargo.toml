[package]
name = "buran"
version = "1.10.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightweight ACP agent harness: one binary, zero built-in tools, everything via MCP"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hclient = { version = "0.1.0-alpha.20", features = ["default-transport", "json"] }
agent-client-protocol = { version = "5", features = ["stdio", "process"] }
agent-client-protocol-http = { workspace = true }
axum = { workspace = true }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "server", "macros", "transport-child-process", "transport-async-rw", "transport-io"] }
uuid.workspace = true
jiff.workspace = true
itertools.workspace = true
futures.workspace = true
tokio-util.workspace = true
toml_edit.workspace = true
tracing-appender.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
hclient = { version = "0.1.0-alpha.20", features = ["test-util", "json"] }
futures = "0.3"
http = "1"
tempfile = "3"
uuid.workspace = true
